<!doctype html>

<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <title>دليل النظام المحاسبي اودو</title>
    <link rel="stylesheet" href="ind.css" />
    <link rel="short icon" href="exo2.png" />
  </head>
  <body>

    <section class="dots-container" id="global-loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </section>

    <div class="video-bg-container">
      <video autoplay loop muted playsinline poster="exo2.png">
        <source src="Floating_glass_dashboard_digital…_202607231225.mp4" type="video/mp4" />
      </video>
      <div class="video-overlay"></div>
    </div>

    <div class="main-content">
      <div></div>

      <header class="hero-section">
        <img src="exo2.png" alt="شعار الشركة" class="logo" />
        <h1>دليل النظام المحاسبي Odoo</h1>
        <p id="typewriter-text"></p>
        <a href="operations.html" class="btn">ابدأ الآن</a>
      </header>

      <div class="features-container">
        <div class="feature">🎥 شروحات فيديو</div>
        <div class="feature">📝 خطوات واضحة</div>
        <div class="feature">⚠️ أخطاء شائعة</div>
      </div>

        

      <div class="bottom-bar">
        
        <footer>جميع الحقوق محفوظة لشركة العيسائي اكسو التجارية © 2026</footer><button class="back" onclick="logout()">تسجيل خروج</button>
      </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
      const textElement = document.getElementById('typewriter-text');
      const phrases = [
        "شرح مبسّط للأعمال اليومية لموظفي الشركة خطوة بخطوة",
        "تعلم كيفية إدارة الفواتير من خلال شروحات فيديو بسهولة",
        "دليلك الكامل لإتقان نظام Odoo المحاسبي"
      ];

      let phraseIndex = 0;
      let charIndex = 0;
      let isDeleting = false;

      function type() {
        const current = phrases[phraseIndex];
        
        if (isDeleting) {
          textElement.innerHTML = current.substring(0, charIndex - 1) + '<span class="typewriter-cursor"></span>';
          charIndex--;
        } else {
          textElement.innerHTML = current.substring(0, charIndex + 1) + '<span class="typewriter-cursor"></span>';
          charIndex++;
        }

        let speed = isDeleting ? 35 : 75;

        if (!isDeleting && charIndex === current.length) {
          speed = 2200;
          isDeleting = true;
        } else if (isDeleting && charIndex === 0) {
          isDeleting = false;
          phraseIndex = (phraseIndex + 1) % phrases.length;
          speed = 400;
        }

        setTimeout(type, speed);
      }

      document.addEventListener('DOMContentLoaded', type);

      function handleLoader() {
        const loader = document.getElementById("global-loader");
        if (loader) {
          setTimeout(() => {
            loader.style.opacity = "0";
            setTimeout(() => { loader.style.display = "none"; }, 400);
          }, 500);
        }
      }
      window.addEventListener("load", handleLoader);
      window.addEventListener("pageshow", (e) => { if (e.persisted) handleLoader(); });
    
    </script>
  </body>
</html>
